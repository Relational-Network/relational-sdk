[package]
name = "drt-mean"
version = "0.1.0"
edition = "2021"
description = "Sample DRT: compute the arithmetic mean of a numeric CSV column inside the enclave."
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
