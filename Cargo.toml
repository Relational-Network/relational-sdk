[package]
name = "relational-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Relational Network"]
description = "Enclave Microservice using Axum"
license = "AGPL-3.0-or-later"
rust-version = "1.92"

[features]
default = []
dev = []

[dependencies]
# ── Web framework ──────────────────────────────────────────────────
axum = { version = "0.8.8", features = ["multipart"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "set-header", "trace"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }

# ── Serialization ──────────────────────────────────────────────────
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# ── OpenAPI / Swagger ──────────────────────────────────────────────
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# ── TLS & Crypto ───────────────────────────────────────────────────
rustls = { version = "0.23.36", default-features = false, features = ["aws-lc-rs"] }
# CRITICAL: Only enable p256 for ES256 (ECDSA P-256) - NEVER use rust_crypto or rsa features!
# The rsa crate has unfixed vulnerability RUSTSEC-2023-0071 (Marvin Attack)
# aws_lc_rs provides CryptoProvider without the vulnerable rsa crate (uses AWS-LC/BoringSSL)
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["use_pem", "p256", "aws_lc_rs"] }
p256 = { version = "0.13.2", features = ["pkcs8", "ecdh"] }
sha2 = "0.10.9"
hmac = "0.12"
base64 = "0.22.1"
hkdf = "0.12.4"
aes-gcm = "0.10.3"

# ── HTTP client (hyper-direct, no reqwest) ────────────────────────
# Hand-rolled minimal client in src/http_client.rs avoids the entire
# url → idna → icu_* chain (~25 transitive crates of Unicode data
# tables) that `reqwest` would otherwise pull in.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "aws-lc-rs"] }
http-body-util = "0.1"
bytes = "1"
rustls-pemfile = "2"
webpki-roots = "1"

# ── Observability ──────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Utilities ──────────────────────────────────────────────────────
uuid = { version = "1.16", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.4.0"

# ── Solana (granular) ──────────────────────────────────────────────
# Replaces monolithic solana-sdk + solana-client + spl-token + spl-ata
# with granular crates and inline instruction builders.
# SPL crates replaced with ~40 lines in blockchain/spl_token.rs.
solana-pubkey = { version = "4.1", features = ["sha2", "curve25519", "borsh"] }
solana-keypair = "3.1"
solana-signer = "3"
solana-signature = "3.3"
solana-hash = "4.2"
solana-instruction = "3.2"
solana-transaction = { version = "4", features = ["serde", "blake3"] }
solana-message = { version = "4", features = ["serde"] }
solana-system-interface = { version = "3.1", features = ["bincode"] }
bincode = "1.3"
# ── Borsh serialization (DRT smart contract) ─────────────────
borsh = { version = "1", features = ["derive"] }
hex = "0.4"
# ── Embedded database ─────────────────────────────────────────────
redb = "3.1"

# ── In-process cache ──────────────────────────────────────────────
lru = "0.16"
dashmap = "6"
