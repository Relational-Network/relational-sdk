[package]
name = "relational-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Relational Network"]
description = "Enclave Microservice using Axum"
license = "AGPL-3.0-or-later"
rust-version = "1.92"

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.22.1"
# Note: We only enable p256 for ES256 (ECDSA P-256) - no RSA to avoid RUSTSEC-2023-0071
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["use_pem", "p256"] }
p256 = { version = "0.13.2", features = ["pkcs8"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
rustls = { version = "0.23.36", default-features = false, features = ["ring"] }
