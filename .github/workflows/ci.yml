# ⚠️ LIMITED CI - NO SGX HARDWARE
# 
# GitHub Actions runners don't have SGX hardware, so this workflow can only:
# - Check code formatting (cargo fmt)
# - Run clippy lints
# - Run unit tests (no SGX-dependent tests)
# - Build release binary (unsigned, cannot run in SGX)
#
# For full testing including RA-TLS attestation, you must test on an SGX VM:
#   make SGX=1 RA_TYPE=dcap
#   make test-attest

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  build-binary:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: relational-sdk-binary
          path: target/release/relational-sdk
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit
        # Note: We use P-256 ECDSA only (no RSA) to avoid vulnerabilities like
        # RUSTSEC-2023-0071. The jsonwebtoken crate is configured with only the
        # "p256" feature to exclude RSA dependencies entirely.

  validate-config:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install systemd (for systemd-analyze)
        run: sudo apt-get update && sudo apt-get install -y systemd

      - name: Validate systemd service file
        run: |
          echo "Validating scripts/enclave.service..."
          # Basic syntax check
          systemd-analyze verify scripts/enclave.service || echo "Warning: systemd-analyze may report issues due to missing runtime dependencies"
          
          # Check for required sections
          if ! grep -q '\[Unit\]' scripts/enclave.service; then
            echo "ERROR: Missing [Unit] section"
            exit 1
          fi
          if ! grep -q '\[Service\]' scripts/enclave.service; then
            echo "ERROR: Missing [Service] section"
            exit 1
          fi
          if ! grep -q '\[Install\]' scripts/enclave.service; then
            echo "ERROR: Missing [Install] section"
            exit 1
          fi
          
          echo "✓ Systemd service file validation passed"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning