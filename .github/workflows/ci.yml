# CI
#
# ⚠️ NO SGX HARDWARE — GitHub Actions runners cannot run the enclave.
# This workflow handles:
#   - Lint (cargo fmt, clippy) and unit tests
#   - Security audit (cargo audit)
#   - Dockerfile lint (hadolint)
#   - Release binary build + artifact upload
#   - Docker image build + sign (build-time signing via --mount=type=secret)
#     - On push to staging/main: pushed to GHCR, measurements printed to job summary
#     - On pull_request: built locally for verification only (not pushed)
#
# For full SGX testing including RA-TLS attestation, run on an SGX VM:
#   make RA_TYPE=dcap
#   make test-attest

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  build-binary:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: relational-sdk-binary
          path: target/release/relational-sdk
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit
        # Note: We use P-256 ECDSA only (no RSA) to avoid vulnerabilities like
        # RUSTSEC-2023-0071. The jsonwebtoken crate is configured with only the
        # "p256" feature to exclude RSA dependencies entirely.

  validate-config:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install systemd (for systemd-analyze)
        run: sudo apt-get update && sudo apt-get install -y systemd

      - name: Validate systemd service file
        run: |
          echo "Validating scripts/enclave.service..."
          # Basic syntax check
          systemd-analyze verify scripts/enclave.service || echo "Warning: systemd-analyze may report issues due to missing runtime dependencies"
          
          # Check for required sections
          if ! grep -q '\[Unit\]' scripts/enclave.service; then
            echo "ERROR: Missing [Unit] section"
            exit 1
          fi
          if ! grep -q '\[Service\]' scripts/enclave.service; then
            echo "ERROR: Missing [Service] section"
            exit 1
          fi
          if ! grep -q '\[Install\]' scripts/enclave.service; then
            echo "ERROR: Missing [Install] section"
            exit 1
          fi
          
          echo "✓ Systemd service file validation passed"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning

  build-docker:
    name: Build & Sign Docker Image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/relational-network/relational-sdk:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/staging' && 'ghcr.io/relational-network/relational-sdk:staging-latest' || '' }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/relational-network/relational-sdk:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            signing_key=${{ secrets.ENCLAVE_SIGNING_KEY }}
          build-args: |
            SGX_DEBUG=0

      - name: Print measurements to job summary
        if: github.event_name == 'push'
        run: |
          echo "## Enclave Measurements" >> $GITHUB_STEP_SUMMARY
          docker run --rm \
            --entrypoint gramine-sgx-sigstruct-view \
            ghcr.io/relational-network/relational-sdk:sha-${{ github.sha }} \
            /app/relational-sdk.sig >> $GITHUB_STEP_SUMMARY

      - name: Verify MRENCLAVE matches measurements.txt
        if: github.event_name == 'push'
        run: |
          BUILT_MR=$(docker run --rm \
            --entrypoint gramine-sgx-sigstruct-view \
            ghcr.io/relational-network/relational-sdk:sha-${{ github.sha }} \
            /app/relational-sdk.sig 2>/dev/null \
            | grep 'mr_enclave:' | awk '{print $2}' | head -1)

          EXPECTED_MR=$(grep '^mr_enclave:' measurements.txt | awk '{print $2}' | head -1)

          echo "Built:    $BUILT_MR"
          echo "Expected: $EXPECTED_MR  (measurements.txt)"

          if [ "$BUILT_MR" != "$EXPECTED_MR" ]; then
            echo "::error::MRENCLAVE changed!"
            echo "  Built:    $BUILT_MR"
            echo "  Expected: $EXPECTED_MR"
            echo ""
            echo "If this change is intentional, update measurements.txt in the same PR."
            exit 1
          fi
          echo "✓ MRENCLAVE matches measurements.txt"